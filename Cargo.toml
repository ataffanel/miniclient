[package]
name = "miniclient"
version = "0.1.0"
edition = "2024"
build = "build.rs"
authors = ["Arnaud Taffanel <arnaud@bitcraze.se>"]
description = "Minimal Crazyflie client for gamepad-based flight control"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ataffanel/miniclient"

[dependencies]
slint = "1.15"
crazyflie-lib = "0.5"
crazyflie-link = "0.4"
tokio = { version = "1", features = ["rt-multi-thread"] }
tokio-util = "0.7"
gilrs = "0.11"

[build-dependencies]
slint-build = "1.15"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
ico = "0.5.0"
