name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install WiX Toolset v3 (portable)
        run: |
          $wixUrl = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          Invoke-WebRequest -Uri $wixUrl -OutFile wix3-binaries.zip
          Expand-Archive wix3-binaries.zip -DestinationPath wix3-binaries
          echo "$PWD\wix3-binaries" | Out-File -FilePath $env:GITHUB_PATH -Append
        shell: pwsh

      - name: Install cargo-wix
        run: cargo install cargo-wix

      - name: Build release binary
        run: cargo build --release

      - name: Build MSI
        run: cargo wix --no-build --nocapture

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/wix/*.msi
          generate_release_notes: true
