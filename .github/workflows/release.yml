name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install WiX Toolset v3 (portable)
        run: |
          $wixUrl = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          Invoke-WebRequest -Uri $wixUrl -OutFile wix3-binaries.zip
          Expand-Archive wix3-binaries.zip -DestinationPath wix3-binaries
          echo "$PWD\wix3-binaries" | Out-File -FilePath $env:GITHUB_PATH -Append
        shell: pwsh

      - name: Install cargo-wix
        run: cargo install cargo-wix

      - name: Build release binary
        run: cargo build --release

      - name: Build MSI
        run: cargo wix --no-build --nocapture

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: target/wix/*.msi

  build-macos:
    name: Build macOS DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)

          # Create a temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import the certificate
          echo "$CERTIFICATE_P12" | base64 --decode > /tmp/certificate.p12
          security import /tmp/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm /tmp/certificate.p12

          # Allow codesign to use the keychain without a UI prompt
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to the keychain search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Install cargo-bundle
        run: cargo install cargo-bundle

      - name: Build .app bundle
        run: cargo bundle --release

      - name: Bundle libusb into .app and sign
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          APP_PATH=$(find target/release/bundle/osx -name "*.app" | head -1)
          BINARY="$APP_PATH/Contents/MacOS/miniclient"
          FRAMEWORKS="$APP_PATH/Contents/Frameworks"
          mkdir -p "$FRAMEWORKS"

          # Find libusb on the runner (installed by Homebrew)
          LIBUSB_SRC=$(brew --prefix libusb)/lib/libusb-1.0.0.dylib

          # Copy it into the bundle
          cp "$LIBUSB_SRC" "$FRAMEWORKS/libusb-1.0.0.dylib"

          # Find the load path the binary currently uses for libusb
          OLD_PATH=$(otool -L "$BINARY" | awk '/libusb/{print $1}')

          # Rewrite the binary to load libusb from @executable_path/../Frameworks/
          install_name_tool \
            -change "$OLD_PATH" \
            "@executable_path/../Frameworks/libusb-1.0.0.dylib" \
            "$BINARY"

          # Also fix the identity name inside the dylib itself
          install_name_tool \
            -id "@executable_path/../Frameworks/libusb-1.0.0.dylib" \
            "$FRAMEWORKS/libusb-1.0.0.dylib"

          # Sign the bundled dylib with our identity (Team ID must match the binary)
          codesign --force --options runtime \
            --sign "$SIGNING_IDENTITY" \
            "$FRAMEWORKS/libusb-1.0.0.dylib"

          # Sign any other dylibs/so files found in the bundle
          find "$APP_PATH" -type f \( -name "*.dylib" -o -name "*.so" \) \
            ! -path "*/Frameworks/libusb*" | while read f; do
            codesign --force --options runtime --sign "$SIGNING_IDENTITY" "$f"
          done

          # Sign the whole bundle
          codesign --force --deep --options runtime \
            --sign "$SIGNING_IDENTITY" \
            --entitlements packaging/entitlements.plist \
            "$APP_PATH"

          # Verify
          codesign --verify --deep --strict "$APP_PATH"
          echo "Signed successfully: $APP_PATH"

      - name: Build DMG
        run: |
          pipx run dmgbuild -s packaging/dmgsettings.py "Crazyflie Mini Client" "Crazyflie Mini Client-macos-${{ matrix.arch }}.dmg"

      - name: Sign DMG
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --sign "$SIGNING_IDENTITY" \
            "Crazyflie Mini Client-macos-${{ matrix.arch }}.dmg"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit \
            "Crazyflie Mini Client-macos-${{ matrix.arch }}.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Staple notarization ticket to DMG
        run: |
          xcrun stapler staple "Crazyflie Mini Client-macos-${{ matrix.arch }}.dmg"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: "*.dmg"

  build-linux:
    name: Build Linux AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t miniclient-builder -f packaging/Containerfile .

      - name: Build AppImage
        run: |
          docker run --rm -v "$PWD:/src:Z" miniclient-builder bash -c "
            cargo build --release &&
            cp icon.png miniclient.png &&
            QMAKE=qmake linuxdeploy \
              --appdir AppDir \
              --executable target/release/miniclient \
              --desktop-file packaging/miniclient.desktop \
              --icon-file miniclient.png \
              --plugin qt &&
            echo 'export XDG_DATA_DIRS=\"\${APPDIR}/usr/share\"' >> AppDir/apprun-hooks/linuxdeploy-plugin-qt-hook.sh &&
            ARCH=\$(uname -m) appimagetool AppDir/
          "

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-${{ matrix.arch }}
          path: "*.AppImage"

  release:
    name: Create GitHub Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.msi
            *.dmg
            *.AppImage
          generate_release_notes: true
